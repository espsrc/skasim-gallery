<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Page not found · skasim gallery</title>
        <link rel="icon" type="image/png" sizes="32x32" href="/skasim-gallery/logos/favicon-32.png" />
        <link rel="icon" href="/skasim-gallery/logos/favicon.ico" sizes="any" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500..600&amp;family=Sora:wght@300..600&amp;display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #fafaf9;
                --text: #1c1917;
                --text-muted: #78716c;
                --accent: #9f1239;
                --border: #e7e5e4;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px 16px;
                box-sizing: border-box;
                font-family: "Sora", system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.65;
                text-align: center;
            }
            .logo {
                font-family: "Cormorant Garamond", serif;
                font-weight: 600;
                font-size: 1.5rem;
                color: var(--text);
                text-decoration: none;
            }
            .logo img {
                display: block;
                height: 32px;
                width: auto;
            }
            .logo span {
                color: var(--accent);
            }
            h1 {
                font-family: "Cormorant Garamond", serif;
                font-weight: 500;
                font-size: clamp(2.2rem, 6vw, 3.4rem);
                margin: 18px 0 8px;
            }
            p {
                color: var(--text-muted);
                font-weight: 300;
                max-width: 34rem;
                margin: 0 auto;
            }
            .btn {
                display: inline-block;
                margin-top: 28px;
                padding: 11px 22px;
                border-radius: 999px;
                background: var(--accent);
                color: #fff;
                font-weight: 500;
                font-size: 0.9rem;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <a href="/skasim-gallery/" class="logo"><img src="/skasim-gallery/logos/skasim-nav.png" alt="skasim" width="126" height="32" /></a>
            <h1>Page not found</h1>
            <p>
                This page is not part of the skasim gallery. The science cases
                are all listed on the gallery's front page.
            </p>
            <a href="/skasim-gallery/#cases" class="btn">Back to the gallery</a>
        </main>
    </body>
</html>
